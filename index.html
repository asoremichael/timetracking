<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Time tracking dashboard</title>
  <link rel="stylesheet" href="style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

<main class="dashboard">

    <!-- Profile card  (jeremy)-->   
    <section class="profile-card">
      <div class="profile-info">
        <img
          src="./images/image-jeremy.png"
          alt="Jeremy Robson"
          class="profile-image"
        >

        <div class="profile-text">
          <p>Report for</p>
          <h1>Jeremy Robson</h1>
        </div>
      </div>

      <nav class="period-options" aria-label="Time period">
        <button type="button" class="period-button"
          data-period="daily" aria-pressed="false">
          Daily
        </button>

        <button type="button" class="period-button active"
          data-period="weekly" aria-pressed="true">
          Weekly
        </button>

        <button type="button" class="period-button"
          data-period="monthly" aria-pressed="false">
          Monthly
        </button>
      </nav>
    </section>

    <!-- Activity cards -->
    <section class="activities" aria-label="Activity statistics">

      <!-- Work -->
      <article class="activity-card work">
        <div class="activity-icon">
          <img src="./images/icon-work.svg" alt="">
        </div>

        <div class="activity-content">
          <div class="activity-heading">
            <h2>Work</h2>
            <button type="button" class="more-button"
              aria-label="More options for Work">•••</button>
          </div>

          <p class="current-hours" data-daily="5" data-weekly="32"
            data-monthly="103">32hrs</p>

          <p class="previous-hours"
            data-previous-daily="7"
            data-previous-weekly="36"
            data-previous-monthly="128">
            Last Week - 36hrs
          </p>
        </div>
      </article>

      <!-- Play -->
      <article class="activity-card play">
        <div class="activity-icon">
          <img src="./images/icon-play.svg" alt="">
        </div>

        <div class="activity-content">
          <div class="activity-heading">
            <h2>Play</h2>
            <button type="button" class="more-button"
              aria-label="More options for Play">•••</button>
          </div>

          <p class="current-hours" data-daily="1" data-weekly="10"
            data-monthly="23">10hrs</p>

          <p class="previous-hours"
            data-previous-daily="2"
            data-previous-weekly="8"
            data-previous-monthly="29">
            Last Week - 8hrs
          </p>
        </div>
      </article>

      <!-- Study -->
      <article class="activity-card study">
        <div class="activity-icon">
          <img src="./images/icon-study.svg" alt="">
        </div>

        <div class="activity-content">
          <div class="activity-heading">
            <h2>Study</h2>
            <button type="button" class="more-button"
              aria-label="More options for Study">•••</button>
          </div>

          <p class="current-hours" data-daily="0" data-weekly="4"
            data-monthly="13">4hrs</p>

          <p class="previous-hours"
            data-previous-daily="1"
            data-previous-weekly="7"
            data-previous-monthly="19">
            Last Week - 7hrs
          </p>
        </div>
      </article>

      <!-- Exercise -->
      <article class="activity-card exercise">
        <div class="activity-icon">
          <img src="./images/icon-exercise.svg" alt="">
        </div>

        <div class="activity-content">
          <div class="activity-heading">
            <h2>Exercise</h2>
            <button type="button" class="more-button"
              aria-label="More options for Exercise">•••</button>
          </div>

          <p class="current-hours" data-daily="1" data-weekly="4"
            data-monthly="11">4hrs</p>

          <p class="previous-hours"
            data-previous-daily="1"
            data-previous-weekly="5"
            data-previous-monthly="18">
            Last Week - 5hrs
          </p>
        </div>
      </article>

      <!-- Social -->
      <article class="activity-card social">
        <div class="activity-icon">
          <img src="./images/icon-social.svg" alt="">
        </div>

        <div class="activity-content">
          <div class="activity-heading">
            <h2>Social</h2>
            <button type="button" class="more-button"
              aria-label="More options for Social">•••</button>
          </div>

          <p class="current-hours" data-daily="1" data-weekly="5"
            data-monthly="21">5hrs</p>

          <p class="previous-hours"
            data-previous-daily="3"
            data-previous-weekly="10"
            data-previous-monthly="23">
            Last Week - 10hrs
          </p>
        </div>
      </article>

      <!-- Self Care -->
      <article class="activity-card self-care">
        <div class="activity-icon">
          <img src="./images/icon-self-care.svg" alt="">
        </div>

        <div class="activity-content">
          <div class="activity-heading">
            <h2>Self Care</h2>
            <button type="button" class="more-button"
              aria-label="More options for Self Care">•••</button>
          </div>

          <p class="current-hours" data-daily="0" data-weekly="2"
            data-monthly="7">2hrs</p>

          <p class="previous-hours"
            data-previous-daily="1"
            data-previous-weekly="2"
            data-previous-monthly="11">
            Last Week - 2hrs
          </p>
        </div>
      </article>

    </section>




     <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Asore Michael</a>.
  </footer>
  </main>


































 
  
 




    <script src="script.js"></script>
</body>
</html>
